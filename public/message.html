<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un message sur l’écran</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; padding: 22px; display: grid; place-items: center;
    background: radial-gradient(circle at top, #352000 0, #111 42%, #080808 100%);
    color: #f5f5f5; font-family: system-ui, -apple-system, sans-serif;
  }
  main {
    width: min(100%, 480px); padding: 28px 22px; border: 1px solid #342817;
    border-radius: 20px; background: #111d; box-shadow: 0 24px 80px #0009;
  }
  .eyebrow { color: #f90; font-size: 12px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
  h1 { margin: 8px 0 6px; font-size: clamp(28px, 8vw, 46px); line-height: 1; }
  .intro { margin: 0 0 24px; color: #aaa; line-height: 1.5; }
  label { display: block; margin-bottom: 7px; color: #ddd; font-size: 14px; font-weight: 700; }
  textarea {
    width: 100%; min-height: 116px; resize: vertical; padding: 14px;
    border: 1px solid #393939; border-radius: 12px; outline: none;
    background: #090909; color: #fff; font: inherit; font-size: 20px;
  }
  textarea:focus { border-color: #f90; box-shadow: 0 0 0 3px #f902; }
  .under { display: flex; justify-content: space-between; margin: 6px 2px 20px; color: #777; font-size: 12px; }
  .options { display: flex; gap: 20px; align-items: center; margin-bottom: 22px; }
  .option { display: flex; gap: 8px; align-items: center; color: #bbb; font-size: 14px; }
  input[type=color] { width: 42px; height: 34px; padding: 0; border: 0; background: none; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: #f90; }
  button {
    width: 100%; padding: 15px 18px; border: 0; border-radius: 12px;
    background: #f80; color: #111; font: inherit; font-size: 17px; font-weight: 900;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: wait; }
  #status { min-height: 24px; margin: 16px 2px 0; text-align: center; font-weight: 700; }
  #status.ok { color: #70e58b; }
  #status.error { color: #ff7979; }
  .tracking {
    display: none; margin-top: 18px; padding: 16px; border: 1px solid #3b3222;
    border-radius: 13px; background: #18140d;
  }
  .tracking.show { display: block; }
  .tracking-title { color: #ffb13b; font-size: 17px; font-weight: 900; }
  .tracking-detail { margin-top: 6px; color: #bbb; line-height: 1.45; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Panneau LED</div>
  <h1>Écris sur l’écran</h1>
  <p class="intro" id="intro">Ton message sera ajouté à la file et défilera une fois sur le panneau.</p>

  <form id="messageForm">
    <label for="message">Ton message</label>
    <textarea id="message" maxlength="80" required autocomplete="off" placeholder="Écris quelque chose…"></textarea>
    <div class="under"><span>80 caractères maximum</span><span id="counter">0 / 80</span></div>

    <div class="options">
      <label class="option">Couleur <input type="color" id="color" value="#ffffff"></label>
      <label class="option"><input type="checkbox" id="rainbow"> Arc-en-ciel</label>
    </div>

    <button type="submit" id="submitButton">Envoyer sur l’écran</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>

  <div class="tracking" id="tracking" aria-live="polite">
    <div class="tracking-title" id="trackingTitle"></div>
    <div class="tracking-detail" id="trackingDetail"></div>
  </div>
</main>

<script src="/message.js"></script>
</body>
</html>
