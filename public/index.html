<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Controller</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #eee; font-family: system-ui, sans-serif; font-size: 15px; }

  header {
    background: #111; padding: 12px 20px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid #222;
    position: sticky; top: 0; z-index: 10;
    flex-wrap: wrap;
  }
  h1 { font-size: 17px; font-weight: 800; letter-spacing: 3px; color: #f80; white-space: nowrap; }
  .now-playing { flex: 1; min-width: 160px; }
  .now-playing .label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  .now-playing .name { font-size: 18px; font-weight: 700; color: #f90; line-height: 1.2; }
  .progress-bar { height: 4px; background: #222; border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .progress-fill { height: 100%; background: #f90; border-radius: 2px; transition: width 0.5s linear; }
  .time-label { font-size: 11px; color: #555; margin-top: 2px; }

  .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; transition: opacity .15s, transform .1s; }
  .btn:active { transform: scale(0.95); }
  .btn-red    { background: #d32; color: #fff; }
  .btn-dark   { background: #333; color: #eee; }
  .btn.on     { outline: 3px solid #fff; }

  /* Master brightness */
  .master-bright { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .master-bright span { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
  .master-bright input[type=range] { width: 120px; accent-color: #ff0; height: 16px; }

  main { padding: 16px 20px; max-width: 960px; margin: 0 auto; }
  section { margin-bottom: 24px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 10px; border-bottom: 1px solid #1e1e1e; padding-bottom: 4px; }

  /* VJ */
  .vj-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .kick-btn {
    width: 110px; height: 110px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle, #f40 40%, #900 100%);
    color: #fff; font-size: 16px; font-weight: 900;
    box-shadow: 0 0 25px #f406; transition: transform .1s;
    user-select: none;
  }
  .kick-btn:active { transform: scale(0.9); box-shadow: 0 0 50px #f40; }

  /* Text */
  .text-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .text-grid { grid-template-columns: 1fr; } }
  .text-card { background: #171717; border-radius: 10px; padding: 12px; }
  .text-card label { display: block; font-size: 11px; color: #777; margin-bottom: 5px; }
  .text-card input[type=text] {
    width: 100%; background: #0d0d0d; border: 1px solid #2a2a2a; color: #fff;
    padding: 8px 10px; border-radius: 6px; font-size: 15px; outline: none;
  }
  .text-card input[type=text]:focus { border-color: #f90; }
  .color-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .color-row span { font-size: 11px; color: #666; }
  input[type=color] { width: 34px; height: 30px; border: none; background: none; cursor: pointer; padding: 0; border-radius: 4px; }

  /* Effects */
  .effect-list { display: flex; flex-direction: column; gap: 6px; }
  .effect-card {
    background: #161616; border-radius: 8px; padding: 10px 14px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
    border: 2px solid transparent; transition: border-color .2s;
  }
  .effect-card.active-card { border-color: #f90; background: #1c1800; }

  /* Toggle */
  .tog { display: inline-block; width: 36px; height: 20px; position: relative; }
  .tog input { opacity: 0; width: 0; height: 0; }
  .tog-track {
    position: absolute; inset: 0; border-radius: 20px; background: #2a2a2a; cursor: pointer; transition: background .2s;
  }
  .tog-track:before {
    content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px;
    border-radius: 50%; background: #666; transition: transform .2s, background .2s;
  }
  .tog input:checked + .tog-track { background: #f80; }
  .tog input:checked + .tog-track:before { transform: translateX(16px); background: #fff; }

  .effect-name { font-size: 14px; font-weight: 600; }
  .effect-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 5px; }
  .srow { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #777; }
  .srow input[type=range] { width: 80px; accent-color: #f90; height: 14px; }
  .srow .val { min-width: 28px; text-align: right; color: #bbb; font-size: 12px; }

  .play-btn { padding: 5px 12px; border: none; border-radius: 6px; cursor: pointer; background: #1a4d1a; color: #7f7; font-weight: 700; font-size: 12px; transition: background .15s; }
  .play-btn:hover { background: #256025; }
  .play-btn:active { transform: scale(0.95); }

  /* Pool entries */
  .pool-entry { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .pool-entry input[type=text] {
    flex: 1; background: #0d0d0d; border: 1px solid #2a2a2a; color: #fff;
    padding: 7px 9px; border-radius: 6px; font-size: 14px; outline: none;
  }
  .pool-entry input[type=text]:focus { border-color: #f90; }
  .pool-del { background: none; border: 1px solid #333; border-radius: 5px; color: #666; cursor: pointer; font-size: 12px; padding: 3px 7px; }
  .pool-del:hover { border-color: #d32; color: #d32; }
  .pool-add-btn { margin-top: 6px; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #aaa; cursor: pointer; font-size: 13px; padding: 5px 12px; width: 100%; }
  .pool-add-btn:hover { border-color: #f90; color: #f90; }

  /* Rainbow / color picker extras */
  .rbtn { padding: 2px 7px; border: 1px solid #333; border-radius: 5px; cursor: pointer; background: #1e1e1e; color: #aaa; font-size: 13px; transition: background .15s, border-color .15s; }
  .rbtn.on { background: #333; border-color: #f90; color: #f90; }
  .srow input[type=color].dim { opacity: 0.3; pointer-events: none; }

  /* Kick color */
  .kick-color { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .kick-color span { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; }
  .kick-bright input[type=range] { width: 70px; accent-color: #f90; }
</style>
</head>
<body>

<header>
  <h1>PANEL</h1>
  <div class="now-playing">
    <div class="label">Now playing</div>
    <div class="name" id="nowName">—</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="time-label" id="timeLabel"> </div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <div class="master-bright">
      <span>Master Bright <span id="masterBrightVal">100%</span></span>
      <input type="range" id="masterBright" min="0" max="100" value="100"
        oninput="setGlobalBrightness(this.value)">
    </div>
    <button class="btn btn-dark" onclick="api('/api/next','POST')">NEXT ›</button>
    <button class="btn btn-red" id="blackoutBtn" onclick="toggleBlackout()">BLACKOUT</button>
  </div>
</header>

<main>

  <section>
    <h2>VJ</h2>
    <div class="vj-row">
      <button class="kick-btn"
        onmousedown="pressKick()" onmouseup="releaseKick()"
        ontouchstart="pressKick()" ontouchend="releaseKick()">⚡<br>KICK</button>
      <div class="kick-color">
        <span>Color</span>
        <input type="color" id="kickColorPicker" value="#ffffff">
        <button class="rbtn" id="kickRainbowBtn" onclick="toggleKickRainbow()" title="Random color each kick">&#127752;</button>
      </div>
      <div class="kick-color kick-bright">
        <span>Bright <span id="kickBrightVal">100%</span></span>
        <input type="range" id="kickBrightSlider" min="0" max="100" value="100"
          oninput="document.getElementById('kickBrightVal').textContent=this.value+'%'">
      </div>
    </div>
  </section>

  <section>
    <h2>Text</h2>
    <div class="text-grid">
      <div class="text-card">
        <label>Scroll entries</label>
        <div id="scrollPool"></div>
        <button class="pool-add-btn" onclick="addPoolEntry('scroll')">+ Add entry</button>
      </div>
      <div class="text-card">
        <label>Static entries</label>
        <div id="staticPool"></div>
        <button class="pool-add-btn" onclick="addPoolEntry('static')">+ Add entry</button>
      </div>
    </div>
    <div class="effect-list" id="textEffectList" style="margin-top:10px"></div>
  </section>

  <section>
    <h2>Effects</h2>
    <div class="effect-list" id="effectList"></div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
