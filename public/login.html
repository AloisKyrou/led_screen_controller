<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration du panneau</title>
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh; margin: 0; padding: 22px; display: grid; place-items: center;
    background: #090909; color: #eee; font-family: system-ui, sans-serif;
  }
  main { width: min(100%, 390px); padding: 28px; border: 1px solid #292929; border-radius: 16px; background: #141414; }
  h1 { margin: 0 0 6px; color: #f90; font-size: 25px; }
  p { margin: 0 0 24px; color: #888; }
  label { display: block; margin: 15px 0 6px; color: #bbb; font-size: 13px; font-weight: 700; }
  input {
    width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px;
    background: #090909; color: #fff; font: inherit; outline: none;
  }
  input:focus { border-color: #f90; }
  button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px; background: #f80; color: #111; font: inherit; font-weight: 900; }
  #error { display: none; margin: 16px 0 0; color: #ff7777; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Administration</h1>
  <p>Connexion réservée au pilotage du panneau.</p>
  <form method="post" action="/admin/login">
    <label for="username">Utilisateur</label>
    <input id="username" name="username" value="admin" required autocomplete="username">
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
    <button type="submit">Se connecter</button>
    <div id="error" role="alert"></div>
  </form>
</main>
<script>
  const previousError = new URLSearchParams(location.search).get('error');
  const element = document.getElementById('error');
  let blockedUntil = 0;
  let credentialsError = previousError === 'credentials';
  if (previousError) history.replaceState(null, '', location.pathname);

  function renderLoginStatus() {
    const remaining = Math.max(0, Math.ceil((blockedUntil - Date.now()) / 1000));
    element.style.display = remaining || credentialsError ? 'block' : 'none';
    element.textContent = remaining
      ? `Trop de tentatives depuis cette adresse IP. Réessaie dans ${Math.floor(remaining / 60)} min ${String(remaining % 60).padStart(2, '0')} s.`
      : credentialsError ? 'Utilisateur ou mot de passe incorrect.' : '';
  }
  async function refreshLoginStatus() {
    try {
      const response = await fetch('/admin/login/status', { cache: 'no-store' });
      if (!response.ok) return;
      const status = await response.json();
      if (status.blocked) credentialsError = false;
      blockedUntil = Date.now() + status.retryAfterSeconds * 1000;
      renderLoginStatus();
    } catch {} // Keep the form usable if a status request fails.
  }
  renderLoginStatus();
  refreshLoginStatus();
  setInterval(renderLoginStatus, 1000);
  setInterval(refreshLoginStatus, 5000);
  window.addEventListener('focus', refreshLoginStatus);
</script>
</body>
</html>
